name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          CRON_SECRET: test-cron-secret-minimum-32-chars-pad!
          NEXT_PUBLIC_APP_URL: https://app.example.com
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_test_token

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

  # Applies every migration in supabase/migrations/ in order against a real
  # Postgres (the supabase/postgres image, not vanilla postgres, because ~17
  # migrations reference the auth.*/storage.* schemas Supabase pre-creates
  # and a plain Postgres image doesn't have). Mocked unit tests can't catch
  # SQL that fails to apply (missing extension, bad syntax, wrong function
  # signature) or a migration that silently doesn't do what its comment
  # claims — this job catches that class of bug before merge, the way
  # 0060's missing `unaccent` extension slipped through mocked tests.
  migrations:
    name: Migrations Apply Cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.8.1.044
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The supabase/postgres image ships the auth/storage schemas but not
      # the auth.uid()/auth.jwt() functions themselves (those come from
      # GoTrue, which isn't running here). RLS policies across this repo's
      # migrations call both. Stub them to return NULL (the same as "no
      # session"), which is the correct, safe behavior for this smoke test —
      # we're checking the SQL applies cleanly, not exercising real auth.
      - name: Stub auth.uid()/auth.jwt() (not provided by GoTrue here)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select null::jsonb $$;
          SQL

      - name: Apply all migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "▶ $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

  # E2E runs on master pushes and manual dispatch only — it is not a PR gate.
  # e2e/artist-portal.spec.ts is a real (non-skip) test against an isolated
  # [E2E TEST] org/artist seeded in production (no staging DB exists yet).
  # Needs E2E_ARTIST_PORTAL_TOKEN as a repo secret to run for real here —
  # without it the spec self-skips. event-cliping.spec.ts still skips
  # unconditionally (needs a dashboard-login auth fixture, see its header).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit, migrations]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" || \
                "${{ needs.migrations.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
